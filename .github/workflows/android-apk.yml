name: Android APK

on:
  push:
    branches:
      - main
      - master
      - pskotenot-hash-android-configurator-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Select Gradle command
        shell: bash
        run: |
          if [[ -x ./gradlew && -f ./gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
            echo "Using repository Gradle Wrapper."
          else
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
            echo "Repository Gradle Wrapper is absent; using Gradle 8.9 from setup-gradle."
          fi

      - name: Assemble debug APK
        run: ${{ env.GRADLE_COMMAND }} --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fs-config-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
